name: Build and Release Plugin

on:
  pull_request:
    paths:
      - .github/workflows/build-and-release.yml
      - package.json
      - package-lock.json
      - scripts/**
      - tests/**
      - tsconfig*.json
      - vite.config.ts
      - src/**
      - backend/**
      - public/**
  push:
    tags:
      - v*.*.*

env: 
  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"


jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    env:
      OUROBOROS_PLUGIN_RELEASE_TAG: v1.1.1-ci
      OUROBOROS_PLUGIN_ARTIFACT: neuroglancer-plugin-v1.1.1-ci.zip

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Test directory protocol
        run: npm test

      - name: Smoke Vite development entry points
        run: npm run smoke:dev

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: npm audit --audit-level=moderate

      - name: Build release layout
        run: npm run build:release

      - name: Validate release layout
        run: npm run validate:release

  plugin-artifact:
    needs: regression
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Set release metadata
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          echo "PLUGIN_ARTIFACT=neuroglancer-plugin-${safe_ref}.zip" >> "$GITHUB_ENV"
          echo "OUROBOROS_PLUGIN_RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OUROBOROS_PLUGIN_ARTIFACT=neuroglancer-plugin-${safe_ref}.zip" >> "$GITHUB_ENV"

      - name: Build release layout
        run: npm run build:release

      - name: Validate release layout
        run: npm run validate:release

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: ${{ env.PLUGIN_ARTIFACT }}
          directory: 'dist'

      - name: Validate release archive
        run: npm run validate:archive -- "dist/${PLUGIN_ARTIFACT}"

      - name: Upload artifact for PR validation
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_ARTIFACT }}
          path: dist/${{ env.PLUGIN_ARTIFACT }}

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: dist/${{ env.PLUGIN_ARTIFACT }}
          token: ${{ secrets.GITHUB_TOKEN }}
