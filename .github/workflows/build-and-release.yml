name: Build and Release Plugin

on:
  pull_request:
    paths:
      - .github/workflows/build-and-release.yml
      - package.json
      - scripts/**
      - vite.config.ts
      - src/**
      - backend/**
      - public/**
  push:
    tags:
      - v*.*.*

env: 
  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"


jobs:
  plugin-artifact:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Set release metadata
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          echo "PLUGIN_ARTIFACT=neuroglancer-plugin-${safe_ref}.zip" >> "$GITHUB_ENV"
          echo "OUROBOROS_PLUGIN_RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OUROBOROS_PLUGIN_ARTIFACT=neuroglancer-plugin-${safe_ref}.zip" >> "$GITHUB_ENV"

      - name: Build release layout
        run: npm run build:release

      - name: Validate release layout
        run: npm run validate:release

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: ${{ env.PLUGIN_ARTIFACT }}
          directory: 'dist'

      - name: Upload artifact for PR validation
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ARTIFACT }}
          path: dist/${{ env.PLUGIN_ARTIFACT }}

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: dist/${{ env.PLUGIN_ARTIFACT }}
          token: ${{ secrets.GITHUB_TOKEN }}
